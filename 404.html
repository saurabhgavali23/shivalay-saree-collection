<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Shivalay Saree Collection</title>
  <!-- GitHub Pages: unknown path (e.g. /saree/124) lands here. Send it to the SPA with the path in ?p= -->
  <script>
    (function () {
      var l = location;
      var path = l.pathname + l.search + l.hash;
      l.replace('/?p=' + encodeURIComponent(path));
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:3rem">Loading… <a href="/">Go to Shivalay Saree Collection</a></p>
</body>
</html>
